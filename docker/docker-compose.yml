version: '3'

services:
  webcrawler.web:
    image: webcrawler.web:latest
    hostname: webcrawler.web
    ports:
      - '9110:9110'
      - '4055:4055'
      - '8080:80'
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: "http://+:80"
      CLUSTER__IP: "webcrawler.web"
      CLUSTER__PORT: 4055
      CLUSTER__SEEDS__0: "akka.tcp://webcrawler@webcrawler.web:4055"
      CLUSTER__STARTUPMETHOD: "SeedNodes"
      CLUSTER__READINESSPORT: 11001
      CLUSTER__PBMPORT: 9110
      CLUSTER__ISDOCKER: "true"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/healthz/akka"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 10s

  webcrawler.crawlservice:
    image: webcrawler.crawler:latest
    deploy:
      replicas: 3
    environment:
      CLUSTER__SEEDS__0: "akka.tcp://webcrawler@webcrawler.web:4055"
      CLUSTER__PORT: 4055
      CLUSTER__STARTUPMETHOD: "SeedNodes"
      CLUSTER__READINESSPORT: 11001
      CLUSTER__PBMPORT: 9110
      CLUSTER__ISDOCKER: "true"
    depends_on:
      webcrawler.web:
        condition: service_healthy

  webcrawler.trackerservice:
    image: webcrawler.tracker:latest
    deploy:
      replicas: 3
    environment:
      CLUSTER__SEEDS__0: "akka.tcp://webcrawler@webcrawler.web:4055"
      CLUSTER__PORT: 4055
      CLUSTER__STARTUPMETHOD: "SeedNodes"
      CLUSTER__READINESSPORT: 11001
      CLUSTER__PBMPORT: 9110
      CLUSTER__ISDOCKER: "true"
    depends_on:
      webcrawler.web:
        condition: service_healthy
