parameters:
  name: ''
  displayName: ''
  vmImage: ''
  publishContainers: false
  timeoutInMinutes: 120

jobs:
  - job: ${{ parameters.name }}
    displayName: ${{ parameters.displayName }}
    timeoutInMinutes: ${{ parameters.timeoutInMinutes }}
    pool:
      vmImage: ${{ parameters.vmImage }}
    steps:
      - checkout: self
        clean: false
        submodules: recursive
        persistCredentials: true
      
      - task: UseDotNet@2
        displayName: 'Install .NET SDK from global.json'
        inputs:
          useGlobalJson: true
      
      # Build solution
      - task: DotNetCoreCLI@2
        displayName: 'Build solution'
        inputs:
          command: build
          projects: '**/*.sln'
          arguments: '--configuration Release'
      
      # Run tests
      - task: DotNetCoreCLI@2
        displayName: 'Run tests'
        inputs:
          command: test
          projects: '**/*.sln'
          arguments: '--configuration Release --no-build --collect:"XPlat Code Coverage"'
          publishTestResults: true
      
      # Publish containers if specified
      - ${{ if eq(parameters.publishContainers, true) }}:
        - task: DotNetCoreCLI@2
          displayName: 'Publish Web container'
          inputs:
            command: publish
            projects: 'src/WebCrawler.Web/WebCrawler.Web.csproj'
            arguments: '--configuration Release /t:PublishContainer'
        
        - task: DotNetCoreCLI@2
          displayName: 'Publish Tracker container'
          inputs:
            command: publish
            projects: 'src/WebCrawler.TrackerService/WebCrawler.TrackerService.csproj'
            arguments: '--configuration Release /t:PublishContainer'
        
        - task: DotNetCoreCLI@2
          displayName: 'Publish Crawler container'
          inputs:
            command: publish
            projects: 'src/WebCrawler.CrawlService/WebCrawler.CrawlService.csproj'
            arguments: '--configuration Release /t:PublishContainer'
